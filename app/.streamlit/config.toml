# 화면 설정 (2026-10-30). main.py 옆에 두어야 어느 폴더에서 streamlit run 을 하든 읽힘
# (Streamlit 은 실행 폴더와 main 스크립트 폴더의 .streamlit 을 읽고, 스크립트 쪽이 우선함)

[server]
# 2번 위험 모니터는 재배포 금지 데이터의 제품 단위 값을 보여 주므로 이 PC 에서만 열리게 함.
# 기본값(빈칸)이면 모든 네트워크 주소에서 받아 같은 망의 다른 PC 도 2번 화면에 들어올 수 있음
address = "localhost"

[client]
# 표 도구 모음의 CSV 내려받기·복사를 끔. 2번 목록을 파일로 내보낼 수 없어야 함 (명세 0절 4번).
# 1·3번 집계표는 저장소의 reports/ 에 그대로 있으므로 화면에서 막아도 잃는 것이 없음
disableDataExport = true

[theme]
# 강조색(버튼·슬라이더·선택 행)을 Streamlit 기본 빨강에서 그림의 '우리 모델' 남색으로 바꿈.
# 빨강은 '나쁜 결과'에만 쓰기로 함 (명세 2-3절, 화면 시안)
primaryColor = "#1f4e79"
